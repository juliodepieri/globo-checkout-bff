name: globo-checkout-bff

services:
  postgres:
    container_name: globo-checkout-bff-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 5s
      retries: 10

  rabbitmq:
    container_name: globo-checkout-bff-rabbitmq
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]   # UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  redis:
    container_name: globo-checkout-bff-redis
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mock-services:
    container_name: globo-checkout-bff-mock-services
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { MODULE: mock-services }
    ports: ["8081:8081"]

  bff:
    container_name: globo-checkout-bff
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { MODULE: bff }
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/checkout
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      CATALOG_BASE_URL: http://mock-services:8081
      PAYMENT_METHODS_BASE_URL: http://mock-services:8081
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-services: { condition: service_started }
